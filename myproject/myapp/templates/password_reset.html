{% extends "base1.html" %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Background styling */
        body {
            background: url('https://source.unsplash.com/1600x900/?hospital,medical,geospatial') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
        }

        /* Container styling */
        .password-reset-container {
            max-width: 450px;
            margin: 80px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        /* Heading styling */
        .password-reset-container h2 {
            font-weight: 600;
            color: #2a71a5; /* Hospital-themed blue */
        }

        /* Paragraph styling */
        .password-reset-container p {
            font-size: 15px;
            color: #444;
        }

        /* Form field styling */
        .password-reset-container form {
            margin-top: 15px;
        }

        .password-reset-container input[type="email"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        /* Submit button styling */
        .password-reset-container button {
            width: 100%;
            padding: 12px;
            background: #2a71a5; /* Medical-themed blue */
            border: none;
            border-radius: 5px;
            font-size: 16px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .password-reset-container button:hover {
            background: #1e5378;
        }

        /* Responsive design */
        @media (max-width: 500px) {
            .password-reset-container {
                width: 90%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="password-reset-container">
        <h2>Password Reset</h2>
        <p>Enter your email address below, and we'll send you instructions to reset your password.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Send Reset Email</button>
        </form>
    </div>
</body>
</html>
{% endblock %}
