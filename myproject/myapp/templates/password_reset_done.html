{% extends "base1.html" %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: url('https://source.unsplash.com/1600x900/?hospital,health') no-repeat center center/cover;">
    <div style="background: rgba(255, 255, 255, 0.9); padding: 30px; border-radius: 10px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2); text-align: center; width: 400px;">
        <h2 style="color: #007bff; font-family: 'Arial', sans-serif; margin-bottom: 10px;">Password Reset Email Sent</h2>
        <p style="font-size: 16px; color: #333; font-family: 'Poppins', sans-serif;">If an account exists with the email you provided, you will receive an email with password reset instructions.</p>
        <p style="font-size: 16px; color: #555; font-family: 'Poppins', sans-serif;">Please check your inbox and follow the instructions.</p>
        <a href="{% url 'login' %}" style="display: inline-block; background: #007bff; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; font-family: 'Poppins', sans-serif;">Back to Login</a>
    </div>
</div>
{% endblock %}
